name: Deploy website to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Build and stage website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/compiler build/website
          mkdir -p build/compiler build/website
          dart compile js -O4 website/main.dart -o build/compiler/main.dart.js
          install -m 0644 \
            website/index.html \
            website/style.css \
            website/components.css \
            website/responsive.css \
            build/website/
          install -m 0644 build/compiler/main.dart.js build/website/main.dart.js
          rm -rf build/compiler

          expected="$(printf '%s\n' \
            components.css \
            index.html \
            main.dart.js \
            responsive.css \
            style.css)"
          actual="$(find build/website -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(find build/website -mindepth 1 ! -type f -print -quit)"
          while IFS= read -r file; do
            test -s "build/website/$file"
          done <<'EOF'
          components.css
          index.html
          main.dart.js
          responsive.css
          style.css
          EOF
          test -z "$(find build/website -type f \
            \( -name '*.map' -o -name '*.deps' -o -name '*.dart.js.*' \) \
            -print -quit)"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
